[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docdense"
version = "0.2.0"
description = "Intake documentation websites and turn them into dense, chunked, LLM-ready text deterministically (stdlib only) — strip HTML boilerplate, densify, heading-aware chunk — so an LLM never burns tokens on raw HTML. 61-75% fewer tokens."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["documentation", "html-to-markdown", "chunking", "rag", "llm", "tokens", "scraping", "ingestion"]
dependencies = []

[project.scripts]
docdense = "docdense.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["docdense"]
